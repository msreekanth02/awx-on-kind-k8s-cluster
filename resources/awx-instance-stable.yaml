---
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
  namespace: awx
spec:
  # Use external PostgreSQL
  postgres_configuration_secret: awx-postgres-configuration
  
  # Admin user setup
  admin_user: admin
  admin_password_secret: awx-admin-password
  
  # Service configuration
  service_type: ClusterIP
  
  # Ingress configuration
  ingress_type: Ingress
  ingress_class_name: nginx
  hostname: awx.local
  
  # Resource configuration - conservative settings for Kind
  web_resource_requirements:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
      
  task_resource_requirements:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
      
  ee_resource_requirements:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Redis configuration
  redis_resource_requirements:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  
  # Disable projects persistence to avoid volume issues
  projects_persistence: false
  
  # Use default storage class
  projects_storage_class: standard
  projects_storage_size: 8Gi
  
  # Development mode settings
  development_mode: false
  
  # Let operator choose the best image automatically
  image_pull_policy: IfNotPresent
  
  # Auto upgrade
  auto_upgrade: false
  
  # Additional configurations for stability
  web_replicas: 1
  task_replicas: 1
  
  # Timeout settings
  task_privileged: false
  
  # Custom configurations for better stability
  extra_settings:
    - setting: ALLOWED_HOSTS
      value: "['*']"
    - setting: USE_TZ
      value: "True"
    - setting: TIME_ZONE
      value: "'UTC'"

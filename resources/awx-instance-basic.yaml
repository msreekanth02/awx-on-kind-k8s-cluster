---
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
  namespace: awx
spec:
  # Use external PostgreSQL
  postgres_configuration_secret: awx-postgres-configuration
  
  # Admin user setup
  admin_user: admin
  admin_password_secret: awx-admin-password
  
  # Service configuration
  service_type: ClusterIP
  
  # Ingress configuration - using host IP
  ingress_type: Ingress
  ingress_class_name: nginx
  hostname: awx-192-168-1-243.nip.io
  
  # Resource configuration - increased memory for initialization
  web_resource_requirements:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
      
  task_resource_requirements:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
      
  ee_resource_requirements:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  # Redis configuration
  redis_resource_requirements:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  
  # Disable projects persistence to avoid volume issues
  projects_persistence: false
  
  # Simple configuration
  auto_upgrade: false
  
  # Host IP configuration
  extra_settings:
    - setting: ALLOWED_HOSTS
      value: "['*', 'awx-192-168-1-243.nip.io', '192.168.1.243', 'localhost', 'awx.local']"
    - setting: USE_TZ
      value: "True"
  
  # Single replica for simplicity
  web_replicas: 1
  task_replicas: 1

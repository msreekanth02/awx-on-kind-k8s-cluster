kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: awx-cluster
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 30080
    hostPort: 8082
    protocol: TCP
    listenAddress: "0.0.0.0"
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
    listenAddress: "0.0.0.0"
- role: worker
- role: worker
